services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - authoring-api
      - kratos-worker
    ports:
      - "127.0.0.1:3000:80"

  authoring-api:
    build:
      context: .
      dockerfile: Dockerfile.authoring
    environment:
      KSA_TEMPLATE_DIR: /case
      KSA_WORKSPACE_DIR: /workspace
      KSA_WORKER_URL: http://kratos-worker:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./cases/test_model_3d.gid:/case:ro
      - ./workspace:/workspace

  kratos-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.kratos
    environment:
      KSA_CASE_DIR: /case
      KSA_OUTPUT_DIR: /artifacts
      KSA_REVISION_DIR: /workspace/revisions
      KSA_VALIDATION_DIR: /workspace/validation
      OMP_NUM_THREADS: "2"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./cases/test_model_3d.gid:/case:ro
      - ./artifacts:/artifacts
      - ./workspace:/workspace:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 2s
      retries: 5
